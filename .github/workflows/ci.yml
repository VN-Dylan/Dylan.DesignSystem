name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Token guard (no literal colours)
        run: pnpm check:tokens

      - name: API coverage vs Eyris crawl
        run: pnpm check:api

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm storybook:build
