name: Deploy CI/CD

# Builds the showcase app (Vite SPA) and the Storybook handbook (static),
# rsyncs both static trees to the VPS, installs the nginx vhost config
# (infra/nginx/dylan-designsystem.conf) and reloads nginx. Runs only on
# push to main.
#
# Required repo secrets:
#   VPS_SSH_KEY  - ed25519 PRIVATE key WITHOUT a passphrase, whose public key is
#                  in ~/.ssh/authorized_keys for VPS_USER on the VPS
#   VPS_USER     - ssh user on the VPS
#
# Server-side prerequisites (NOT managed here):
#   - VPS_USER has passwordless sudo for: install, chmod, nginx, systemctl.
#   - TLS cert at /etc/letsencrypt/live/dylan.com.vn/ with a SAN covering both
#     subdomains; DNS for showcase/storybook.dylan.com.vn pointed at the VPS.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VPS_HOST: 103.72.97.160
  VPS_PORT: '24700'
  SHOWCASE_DIR: /mnt/SourceCode/DylanDesignSystem/showcase
  STORYBOOK_DIR: /mnt/SourceCode/DylanDesignSystem/storybook
  SHOWCASE_URL: https://showcase.dylan.com.vn
  STORYBOOK_URL: https://storybook.dylan.com.vn

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Build showcase
        run: pnpm --filter @vn-dylan/showcase build

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Assemble deploy tree
        run: |
          set -e
          rm -rf deploy
          mkdir -p deploy
          cp -R apps/showcase/dist deploy/showcase
          cp -R storybook-static     deploy/storybook
          cp -R infra/nginx          deploy/nginx
          test -f deploy/showcase/index.html
          test -f deploy/storybook/index.html
          test -f deploy/nginx/dylan-designsystem.conf

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-sites
          path: deploy/
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: static-sites
          path: deploy

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Prepare VPS directories
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "${VPS_PORT}" "${{ secrets.VPS_USER }}@${VPS_HOST}" \
            "mkdir -p '${SHOWCASE_DIR}' '${STORYBOOK_DIR}'"

      - name: Sync showcase
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -p ${VPS_PORT}" \
            deploy/showcase/ "${{ secrets.VPS_USER }}@${VPS_HOST}:${SHOWCASE_DIR}/"

      - name: Sync Storybook
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -p ${VPS_PORT}" \
            deploy/storybook/ "${{ secrets.VPS_USER }}@${VPS_HOST}:${STORYBOOK_DIR}/"

      - name: Configure nginx
        run: |
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -P "${VPS_PORT}" \
            deploy/nginx/dylan-designsystem.conf \
            "${{ secrets.VPS_USER }}@${VPS_HOST}:/tmp/dylan-designsystem.conf"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -p "${VPS_PORT}" \
            "${{ secrets.VPS_USER }}@${VPS_HOST}" 'bash -se' <<'EOF'
          set -e
          SUDO=""
          [ "$(id -u)" != "0" ] && SUDO="sudo"
          $SUDO install -o root -g root -m 644 /tmp/dylan-designsystem.conf \
            /etc/nginx/conf.d/dylan-designsystem.conf
          rm -f /tmp/dylan-designsystem.conf
          # let the nginx worker traverse into the site roots
          $SUDO chmod o+x /mnt /mnt/SourceCode /mnt/SourceCode/DylanDesignSystem
          $SUDO nginx -t
          $SUDO systemctl reload nginx
          EOF

      - name: Smoke test
        run: |
          set -e
          for url in "${SHOWCASE_URL}" "${STORYBOOK_URL}"; do
            echo "Checking ${url}"
            curl -fsS --compressed --retry 10 --retry-delay 3 --retry-all-errors \
              "${url}/" -o /dev/null
          done
