# Source: infra/nginx/dylan-designsystem.conf
# Runs inside the `dylan-ds-nginx` container (infra/compose.yaml).
# TLS is terminated by Dylan.Plan's edge nginx, which proxies
# showcase/storybook.dylan.com.vn here by Host header over the shared
# `dylanplan_default` docker network. This server only speaks plain HTTP.

# ── showcase (Vite SPA) ────────────────────────────────────────────────
server {
    listen 80;
    server_name showcase.dylan.com.vn;

    root  /srv/showcase;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed build assets — safe to cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── storybook (static handbook) ───────────────────────────────────────
# default_server so an unmatched Host still lands somewhere sane.
server {
    listen 80 default_server;
    server_name storybook.dylan.com.vn;

    root  /srv/storybook;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
