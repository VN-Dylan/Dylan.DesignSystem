# Source: infra/nginx/dylan-designsystem.conf
# Deployed to /etc/nginx/conf.d/dylan-designsystem.conf by .github/workflows/deploy.yml.
# Serves the two static sites rsync'd to /mnt/SourceCode/DylanDesignSystem/*.
# TLS uses the existing dylan.com.vn certificate (SAN covers both subdomains).

# ── showcase (Vite SPA) ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name showcase.dylan.com.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name showcase.dylan.com.vn;

    ssl_certificate     /etc/letsencrypt/live/dylan.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dylan.com.vn/privkey.pem;

    root  /mnt/SourceCode/DylanDesignSystem/showcase;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed build assets — safe to cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── storybook (static handbook) ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name storybook.dylan.com.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name storybook.dylan.com.vn;

    ssl_certificate     /etc/letsencrypt/live/dylan.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dylan.com.vn/privkey.pem;

    root  /mnt/SourceCode/DylanDesignSystem/storybook;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
